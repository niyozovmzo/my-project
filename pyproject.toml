[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dupefind"
version = "1.0.0"
description = "Fast, dependency-free duplicate file finder for the command line"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Niyozov Muhammad" }]
keywords = ["duplicates", "disk-space", "cleanup", "cli", "hashing"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.scripts]
dupefind = "dupefind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
